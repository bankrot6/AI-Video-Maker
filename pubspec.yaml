name: aivideomaker
description: "AI Video Maker"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# flutter build appbundle --release --dart-define=RUSTORE=true
version: 1.3.26+39

environment:
  sdk: ^3.6.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  flutter_dotenv: ^5.2.1
  camera: ^0.11.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  device_info_plus: ^12.3.0
  crypto: ^3.0.5
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  mocktail: ^1.0.4
  intl: ^0.20.2
  uuid: ^4.5.1
  http: ^1.2.1 # Добавляем HTTP клиент для работы с API
  image: ^4.1.7 # Для локального кропа регионов перед повторным анализом
  stop_watch_timer: ^3.2.2
  flutter_launcher_icons: ^0.14.3
  lottie: ^3.3.1
  in_app_purchase: ^3.1.13 # Пакет для работы с покупками в приложении
  photo_view: ^0.15.0
  gal: ^2.3.0
  cached_network_image: ^3.4.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # google_ml_kit: ^0.20.0  # Временно отключено для решения проблемы с iOS
  record: ^6.0.0 # Для записи звука
  audioplayers: ^6.1.0 # Для воспроизведения голосовых сообщений
  just_audio: ^0.9.42 # Надёжное воспроизведение WAV/PCM
  volume_controller: ^3.4.1 # Проверка системной громкости для TTS
  awesome_notifications: ^0.10.0 # Для отправки локальных уведомлений
  timezone: ^0.10.1 # Для работы с часовыми поясами в уведомлениях
  screenshot: ^3.0.0 # Для создания скриншотов приложения
  share_plus: ^11.0.0 # Для распространения скриншотов
  # yookassa_payments_flutter: ^1.0.6 # Удалено из-за проблем совместимости с iOS
  webview_flutter: ^4.5.0 # Для отображения веб-интерфейса ЮKassa внутри приложения
  webview_flutter_wkwebview: ^3.14.0 # iOS-имплементация WebView для тонких настроек воспроизведения
  uni_links:
    path: ./packages/uni_links # Используем локальную версию с исправленным build.gradle
  translator: ^1.0.3+1
  flutter_rustore_pay: ^10.3.1 # RuStore Pay SDK (подписки + in-app)
  auto_size_text: ^3.0.0 # Для автоматического изменения размера текста
  # water_bottle: ^0.0.7  # Удалено: заменено на Lottie-анимацию стакана воды

  path: any
  flutter_svg: ^2.1.0
  shimmer: ^3.0.0
  loading_indicator: ^3.1.1
  animated_text_kit: ^4.2.2
  xml: ^6.5.0 # Для парсинга XML ответов от Yandex Search API
  logger: ^2.5.0
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.2.5
  in_app_review: ^2.0.10
  package_info_plus: ^8.0.2
  flutter_rustore_review: ^9.1.0
  device_region: ^1.4.0
  bottom_picker: ^4.1.1
  home_widget: 0.6.0
  openfoodfacts: ^3.25.1
  uni_color_palette: ^0.2.1
  palette_generator: ^0.3.3
  flutter_native_splash: ^2.4.1
  vk_video: ^1.0.4
  pedometer: ^4.0.1
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  fl_chart: ^0.70.2
  flutter_staggered_grid_view: ^0.7.0
  permission_handler: ^11.3.1
  flutter_tts: ^4.2.3
  stylish_bottom_bar: ^1.1.1
  video_player: ^2.10.1
  fc_native_video_thumbnail: ^2.2.0
  socks5_proxy: ^2.1.1
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  firebase_storage: ^12.3.8
  cloud_firestore: ^5.6.1
  tutorial_coach_mark: ^1.3.3
  google_mlkit_face_detection: ^0.13.2
  appwrite: ^23.0.0
  android_id: ^0.5.1
  mytracker_sdk: ^3.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  build_runner: ^2.4.15
  flutter_test_ui: ^2.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env # Добавляем .env файл как ресурс, если он существует
    - assets/images/
    - assets/animations/
    - assets/tts_voices/
    - assets/tts_voices/ru_book_dataset/
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Конфигурация для генерации иконок приложения
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/cat-videographer-photo.png"
  adaptive_icon_background: "#2B2826"
  adaptive_icon_foreground: "assets/images/cat-videographer-photo.png"
  adaptive_icon_foreground_inset: 12
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/cat-videographer-photo.png"
  windows:
    generate: true
    image_path: "assets/images/cat-videographer-photo.png"
  macos:
    generate: true
    image_path: "assets/images/cat-videographer-photo.png"

# Конфигурация splash-экрана
flutter_native_splash:
  color: "#2B2826"
  image: "assets/images/cat-videographer-photo.png"
  android_12:
    color: "#2B2826"
    icon_background_color: "#2B2826"
    image: "assets/images/cat-videographer-photo.png"
  web: false
